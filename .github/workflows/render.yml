name: Render ice short
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills = 12 preview pictures (about 10 min), full = the whole video"
        type: choice
        default: stills
        options: [stills, full]
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack and set up the kit
        run: |
          ZIP="$(ls project-v*.zip | sort -V | tail -1)"
          echo "Using $ZIP"
          unzip -q -o "$ZIP"
          bash kit/tools/setup.sh "$PWD/proj"
          rm -rf proj/node_modules
          cp ice/web/story.js ice/web/main.js ice/web/roman.js proj/web/
          cat proj/web/toonbase.js proj/web/roman.js > proj/web/toon.js
          cp ice/mix_raw.wav kit/tools/finish.sh proj/
          ls -la proj/web proj/web/lib
      - uses: actions/upload-artifact@v4
        with:
          name: proj
          path: proj
          retention-days: 3
      - id: m
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            M=$(python3 -c "import json;print(json.dumps({'include':[{'name':'c%02d'%i,'spec':'%d-%d'%(i*196,min(i*196+195,2341))} for i in range(12)]}))")
          else
            M='{"include":[{"name":"stills","spec":"60,330,500,600,740,900,1090,1200,1400,1650,1850,2200"}]}'
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
  render:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: proj
          path: proj
      - name: Install the browser
        working-directory: proj
        run: |
          npm init -y > /dev/null
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Render frames
        working-directory: proj
        run: node render.mjs frames "${{ matrix.spec }}" 1 0.92
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.name }}
          path: proj/frames
          retention-days: 3
  assemble:
    needs: render
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proj
          path: proj
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: proj/frames
          merge-multiple: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Preview pictures
        if: ${{ inputs.mode == 'stills' }}
        working-directory: proj
        run: |
          ls frames | wc -l
          ffmpeg -v error -y -pattern_type glob -i 'frames/f*.jpg' -vf "scale=360:-1,tile=6x2" sheet.jpg
          gh release create "stills-${{ github.run_number }}" sheet.jpg frames/*.jpg --title "Stills ${{ github.run_number }}" --notes "One picture per shot"
      - name: Encode the video
        if: ${{ inputs.mode == 'full' }}
        working-directory: proj
        run: |
          mkdir -p out
          test "$(ls frames | wc -l)" -ge 2342
          bash finish.sh "Ice That Sailed to India"
          gh release create "video-${{ github.run_number }}" out/*.mp4 out/qa_sheet.jpg --title "Video ${{ github.run_number }}" --notes "Finished short"
